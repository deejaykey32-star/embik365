<title>Różaniec Historii Zbawienia</title>
<style>
:root {
  --bg: #f7f4ee;
  --surface: #ffffff;
  --text: #2a2622;
  --muted: #6f675e;
  --accent: #1f3a5f;
  --accent-soft: #e3e9f1;
  --gold: #b8892b;
  --done: #3d7a4f;
  --border: #e4ddd2;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b;
    --surface: #1f2228;
    --text: #ece7df;
    --muted: #a39b90;
    --accent: #8fb1dc;
    --accent-soft: #263243;
    --gold: #d9ad55;
    --done: #6dbb83;
    --border: #30343c;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --surface: #1f2228; --text: #ece7df; --muted: #a39b90;
  --accent: #8fb1dc; --accent-soft: #263243; --gold: #d9ad55; --done: #6dbb83;
  --border: #30343c; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 17px/1.55 Georgia, "Times New Roman", serif;
  padding-bottom: calc(68px + env(safe-area-inset-bottom));
}
button, input { font: inherit; color: inherit; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 10px;
}
.topbar h1 { margin: 0 0 6px; font-size: 1.05rem; color: var(--accent); letter-spacing: .02em; }
.progress { display: flex; align-items: center; gap: 10px; font: 13px system-ui, sans-serif; color: var(--muted); }
.progress-bar { flex: 1; height: 6px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }
.progress-bar span { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }

main { max-width: 680px; margin: 0 auto; padding: 16px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.eyebrow { font: 600 12px/1.3 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); margin: 0 0 6px; }
.mystery-title { font-size: 1.55rem; line-height: 1.25; margin: 0 0 6px; color: var(--accent); }
.ref { font: 14px system-ui, sans-serif; color: var(--muted); margin: 0 0 14px; }
.med { margin: 0 0 14px; }
.fruit { margin: 0; padding: 10px 12px; border-left: 3px solid var(--gold); background: var(--accent-soft); border-radius: 0 8px 8px 0; font-style: italic; }
.fruit b { font-style: normal; }

.badge { display: inline-block; font: 600 12px system-ui, sans-serif; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.badge.done { background: var(--done); color: #fff; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.spread { justify-content: space-between; }
.btn {
  border: 1px solid var(--border); background: var(--surface);
  padding: 10px 16px; border-radius: 10px; cursor: pointer;
  font: 600 15px system-ui, sans-serif;
}
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn.big { width: 100%; padding: 14px; font-size: 16px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: transparent; }

.notice { font: 14px/1.45 system-ui, sans-serif; color: var(--muted); margin: 0 0 12px; }

/* Lista tajemnic */
.part { margin-bottom: 14px; }
.part summary { cursor: pointer; list-style: none; padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.part summary::-webkit-details-marker { display: none; }
.part summary .ptitle { font-weight: bold; color: var(--accent); }
.part summary .pcount { font: 13px system-ui, sans-serif; color: var(--muted); white-space: nowrap; }
.part ol { list-style: none; margin: 0; padding: 0 0 6px; }
.part li button {
  width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--border);
  padding: 10px 14px; display: flex; gap: 12px; align-items: center; cursor: pointer;
}
.part li button .num { font: 600 13px system-ui, sans-serif; color: var(--muted); min-width: 2.2em; }
.part li button .st { margin-left: auto; font-size: 14px; }
.part li.today button { background: var(--accent-soft); }
.part li.done .st { color: var(--done); }
.card.part { padding: 0; overflow: hidden; }

/* Tryb modlitwy */
.prayer-step h3 { margin: 0 0 10px; color: var(--accent); }
.prayer-step p { margin: 0 0 12px; }
.beads { display: flex; justify-content: center; gap: 8px; margin: 18px 0; flex-wrap: wrap; }
.bead { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--gold); background: transparent; transition: background .2s; }
.bead.on { background: var(--gold); }
.tap-area {
  display: block; width: 100%; border: 2px dashed var(--border); background: var(--accent-soft);
  border-radius: 14px; padding: 22px 16px; cursor: pointer; text-align: center; margin-bottom: 12px;
}
.tap-area .count { font: 700 2rem system-ui, sans-serif; color: var(--accent); display: block; }
.steps-dots { display: flex; gap: 5px; justify-content: center; margin-bottom: 14px; }
.steps-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
.steps-dots i.on { background: var(--accent); }

label.field { display: block; margin-bottom: 14px; font: 15px system-ui, sans-serif; }
label.field input { display: block; margin-top: 6px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); width: 100%; max-width: 260px; }
.check { display: flex; gap: 10px; align-items: center; font: 15px system-ui, sans-serif; margin-bottom: 14px; }

.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
  display: flex; background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  flex: 1; border: 0; background: none; padding: 8px 0 10px; cursor: pointer;
  font: 12px system-ui, sans-serif; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.tabbar button span { font-size: 20px; line-height: 1; }
.tabbar button.active { color: var(--accent); font-weight: 600; }

/* Etapy */
.part-line { font: 13px/1.4 system-ui, sans-serif; color: var(--muted); margin: 0 0 8px; }
.stage-intro { border-color: var(--gold); }
.stage-head { font-size: 1.1rem; color: var(--accent); margin: 22px 0 4px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.stage-head:first-child { margin-top: 0; }
.stage-head span { font: 13px system-ui, sans-serif; color: var(--muted); white-space: nowrap; }
.stage-desc { font: 14px/1.45 system-ui, sans-serif; color: var(--muted); margin: 0 0 10px; }
.stages { padding-left: 0; list-style: none; margin: 0 0 16px; }
.stages li { padding: 8px 0; border-top: 1px solid var(--border); font-size: 15px; }
.stages li span { font: 13px/1.4 system-ui, sans-serif; color: var(--muted); }
.part { scroll-margin-top: 80px; }

/* Dopowiedzenia */
.sub { margin: -2px 0 8px; color: var(--gold); font-style: italic; }
.cl-box { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
.cl-box summary, .part-prayer summary { cursor: pointer; font: 600 14px system-ui, sans-serif; color: var(--accent); }
.cl-lead { margin: 10px 0 4px; font-style: italic; color: var(--muted); }
.cl-list { margin: 6px 0 0; padding-left: 1.6em; font-size: 15px; }
.cl-list li { padding: 2px 0; }
.cl-list li.said { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border); }
.cl-list li.now { color: var(--accent); font-weight: bold; }
.hail { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; }
.cl-now { color: var(--accent); }
.part li button .lt { display: flex; flex-direction: column; min-width: 0; }
.part li button .lt small { font: italic 13px Georgia, serif; color: var(--muted); }
.part-prayer { border-top: 1px solid var(--border); padding: 10px 14px; }
.part-prayer p { margin: 8px 0 0; font-size: 15px; }

/* Motyw i lektor */
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.top-row h1 { margin: 0; min-width: 0; }
.theme-btn {
  flex: none; width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface); color: var(--accent);
  font-size: 18px; line-height: 1; cursor: pointer;
}
.theme-btn:focus-visible, .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn.listen { margin-top: 10px; background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn.listen.on { background: var(--gold); color: var(--bg); }
.steps-dots + .btn.listen { margin: 0 0 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
label.field select { display: block; margin-top: 6px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); width: 100%; max-width: 100%; }
label.field input[type=range] { display: block; width: 100%; max-width: 320px; margin-top: 6px; accent-color: var(--accent); }
a { color: var(--accent); }

/* Instalacja */
.dl { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; display: grid; gap: 8px; justify-items: start; }
.dl:first-of-type { border-top: 0; padding-top: 0; margin-top: 4px; }
.dl h3 { margin: 0; font-size: 1.05rem; color: var(--accent); }
.dl .notice { margin: 0; }
.dl details summary { cursor: pointer; font: 600 14px system-ui, sans-serif; color: var(--accent); }
.steps { margin: 6px 0; padding-left: 1.4em; font-size: 15px; }
.steps li { padding: 2px 0; }

/* Auto — lektor bez przerwy */
.now.playing { border-color: var(--gold); }
.auto-bar { height: 4px; background: var(--accent-soft); border-radius: 2px; overflow: hidden; margin-top: 12px; }
.auto-bar span { display: block; height: 100%; background: var(--gold); }
.seg-label { font: 600 13px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 0 4px; }
.seg-text { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; }
.player { display: flex; justify-content: center; align-items: center; gap: 12px; }
.player .btn { font-size: 18px; min-width: 52px; }
.player .play { min-width: 140px; }
label.field input[type=number] { max-width: 120px; }
.book-h { margin: 0 0 6px; font-size: 1.05rem; color: var(--accent); }
#book details { margin-top: 10px; }
#book details summary { cursor: pointer; font: 600 14px system-ui, sans-serif; color: var(--accent); }

</style>

  <header class="topbar">
    <div class="top-row">
      <h1>Różaniec Historii Zbawienia</h1>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Zmień motyw">☾</button>

    <div class="progress" aria-label="Postęp">
      <div class="progress-bar"><span id="progress-fill"></span></div>
      <span id="progress-text"></span>

  <main id="app"></main>

  <script>
// Nowy Różaniec Historii Zbawienia — 7 etapów × 5 części × 5 tajemnic = 175 dni.
// Każdy dzień: jedna tajemnica (jedna dziesiątka różańca).
// Schemat części: { title: "Tajemnice …", prayer: modlitwa na zakończenie, mysteries: [...] }
// Schemat tajemnicy: { t: tytuł, sub: dopowiedzenie (w nawiasie), ref: Pismo/źródło,
//   med: „Rozważamy…”, cl: 10 dopowiedzeń po słowie „Jezus” w każdym Zdrowaś Maryjo }
// Treść etapów: data/stage1.js … data/stage7.js (każdy wywołuje STAGES.push).

const STAGES = [];

const PRAYERS = {
  sign: { name: "Znak krzyża", text: "W imię Ojca i Syna, i Ducha Świętego. Amen." },
  creed: { name: "Wierzę w Boga", text: "Wierzę w Boga, Ojca wszechmogącego, Stworzyciela nieba i ziemi. I w Jezusa Chrystusa, Syna Jego jedynego, Pana naszego, który się począł z Ducha Świętego, narodził się z Maryi Panny, umęczon pod Ponckim Piłatem, ukrzyżowan, umarł i pogrzebion. Zstąpił do piekieł, trzeciego dnia zmartwychwstał. Wstąpił na niebiosa, siedzi po prawicy Boga Ojca wszechmogącego. Stamtąd przyjdzie sądzić żywych i umarłych. Wierzę w Ducha Świętego, święty Kościół powszechny, świętych obcowanie, grzechów odpuszczenie, ciała zmartwychwstanie, żywot wieczny. Amen." },
  ourFather: { name: "Ojcze nasz", text: "Ojcze nasz, któryś jest w niebie, święć się imię Twoje, przyjdź królestwo Twoje, bądź wola Twoja jako w niebie, tak i na ziemi. Chleba naszego powszedniego daj nam dzisiaj; i odpuść nam nasze winy, jako i my odpuszczamy naszym winowajcom; i nie wódź nas na pokuszenie, ale nas zbaw ode złego. Amen." },
  hailMary: { name: "Zdrowaś Maryjo", text: "Zdrowaś Maryjo, łaski pełna, Pan z Tobą, błogosławionaś Ty między niewiastami i błogosławiony owoc żywota Twojego, Jezus. Święta Maryjo, Matko Boża, módl się za nami grzesznymi teraz i w godzinę śmierci naszej. Amen." },
  glory: { name: "Chwała Ojcu", text: "Chwała Ojcu i Synowi, i Duchowi Świętemu. Jak była na początku, teraz i zawsze, i na wieki wieków. Amen." },
  fatima: { name: "O mój Jezu", text: "O mój Jezu, przebacz nam nasze grzechy, zachowaj nas od ognia piekielnego, zaprowadź wszystkie dusze do nieba i dopomóż szczególnie tym, którzy najbardziej potrzebują Twojego miłosierdzia." },
  salveRegina: { name: "Witaj, Królowo", text: "Witaj, Królowo, Matko miłosierdzia, życie, słodyczy i nadziejo nasza, witaj! Do Ciebie wołamy wygnańcy, synowie Ewy; do Ciebie wzdychamy, jęcząc i płacząc na tym łez padole. Przeto, Orędowniczko nasza, one miłosierne oczy Twoje na nas zwróć, a Jezusa, błogosławiony owoc żywota Twojego, po tym wygnaniu nam okaż. O łaskawa, o litościwa, o słodka Panno Maryjo! Módl się za nami, święta Boża Rodzicielko, abyśmy się stali godnymi obietnic Chrystusowych. Amen." },
  salve: { name: "Pod Twoją obronę", text: "Pod Twoją obronę uciekamy się, święta Boża Rodzicielko, naszymi prośbami racz nie gardzić w potrzebach naszych, ale od wszelakich złych przygód racz nas zawsze wybawiać, Panno chwalebna i błogosławiona. O Pani nasza, Orędowniczko nasza, Pośredniczko nasza, Pocieszycielko nasza. Z Synem swoim nas pojednaj, Synowi swojemu nas polecaj, swojemu Synowi nas oddawaj. Amen." }
};

// Wstęp do różańca (po wyznaniu wiary): Ojcze nasz, 3 × Zdrowaś Maryjo z dopowiedzeniami, Chwała Ojcu.
const INTRO_CL = [
  "który przymnożył nam wiary.",
  "który przymnożył nam nadziei.",
  "który przymnożył nam miłości."
];

const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII"];


</script>
  <script>
STAGES.push({

  short: "Księgi Historyczne ST",

        { t: "Tchnienie życia", sub: "Stworzenie człowieka", ref: "Rdz 1,26-31; 2,7-25",

          cl: [

        { t: "Arka ocalenia", sub: "Potop i przymierze z Noem", ref: "Rdz 6,5–9,17; 1 P 3,20-21",
          med: "Rozważamy Noego, który posłuszny Bogu buduje arkę, przechodzi przez wody potopu i otrzymuje znak tęczy — przymierze Boga z całym stworzeniem.",

            "który zgromadził nas w arce Kościoła.",
            "który obmywa ziemię z grzechu.",
            "który przynosi gałązkę oliwną pokoju.",

  <script>
// Spłaszczenie etapów do listy 175 dni (ładowane po data/stage*.js).

// Części numerowane globalnie 1–35.
const PARTS = STAGES.flatMap((stage, si) =>
  stage.parts.map((p) => ({ ...p, stage: si + 1 }))
);

const MYSTERIES = PARTS.flatMap((part, pi) =>
  part.mysteries.map((m, mi) => ({
    ...m,
    stage: part.stage,
    stageTitle: STAGES[part.stage - 1].title,
    part: pi + 1,
    partTitle: part.title,
    inPart: mi + 1
  }))
).map((m, i) => ({ ...m, day: i + 1 }));

const TOTAL_DAYS = MYSTERIES.length; // 175

</script>
<script>
(() => {
  "use strict";

  const STORE_KEY = "rhz-state-v1";
  const DAY_MS = 86400000;
  const app = document.getElementById("app");

  // ---------- Stan ----------
  const defaults = { start: null, done: [], opening: true, closing: true, theme: null, voice: "", rate: 0.95, autoDay: 1, autoSeg: 0, autoAwake: true, short: false };
  let state = load();
  let view = "today";
  let viewDay = null; // dzień oglądany na ekranie „Dziś” (null = bieżący)

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && typeof s === "object") {
        const st = { ...defaults, ...s };
        // Dawny przełącznik Auto „każda tajemnica jak osobny dzień” → wersja krótsza.
        if (s.short === undefined && s.autoDaily === false) st.short = true;
        delete st.autoDaily;
        return st;
      }
    } catch (e) { /* brak dostępu do pamięci */ }
    return { ...defaults };
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignoruj */ }
  }

  // ---------- Daty ----------
  function isoToday() {
    const d = new Date();
    return toIso(d);
  }
  function toIso(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function parseIso(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function daysBetween(a, b) {
    // różnica dni kalendarzowych, odporna na zmianę czasu
    return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) -
                       Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / DAY_MS);
  }
  function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function fmtDate(d) {
    return d.toLocaleDateString("pl-PL", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }

  /** Numer dnia modlitwy według kalendarza (może być <1 lub >175). */
  function calendarDay() {
    if (!state.start) return 1;
    return daysBetween(parseIso(state.start), new Date()) + 1;
  }
  function currentDay() {
    return Math.min(Math.max(calendarDay(), 1), TOTAL_DAYS);
  }
  function dateOfDay(day) {
    return addDays(parseIso(state.start || isoToday()), day - 1);
  }
  const isDone = (day) => state.done.includes(day);

  function setDone(day, value) {
    const set = new Set(state.done);
    value ? set.add(day) : set.delete(day);
    state.done = [...set].sort((a, b) => a - b);
    save();
  }

  // ---------- Pomocnicze ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- Motyw jasny / ciemny ----------
  const root = document.documentElement;
  const hostTheme = root.getAttribute("data-theme");
  const darkMq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  const themeBtn = document.getElementById("theme-btn");

  function effectiveTheme() {
    return state.theme || hostTheme || (darkMq && darkMq.matches ? "dark" : "light");
  }
  function applyTheme() {
    if (state.theme) root.setAttribute("data-theme", state.theme);
    else if (hostTheme) root.setAttribute("data-theme", hostTheme);
    else root.removeAttribute("data-theme");
    const dark = effectiveTheme() === "dark";
    if (themeBtn) {
      themeBtn.textContent = dark ? "☀" : "☾";
      themeBtn.setAttribute("aria-label", dark ? "Włącz motyw jasny" : "Włącz motyw ciemny");
      themeBtn.title = themeBtn.getAttribute("aria-label");
    }
  }
  function setTheme(t) { state.theme = t; save(); applyTheme(); }
  if (themeBtn) themeBtn.onclick = () => setTheme(effectiveTheme() === "dark" ? "light" : "dark");
  if (darkMq && darkMq.addEventListener) darkMq.addEventListener("change", applyTheme);
  // Gdy przeglądarka lub aplikacja nadpisze motyw, przywróć wybór użytkownika.
  new MutationObserver(() => {
    if (state.theme && root.getAttribute("data-theme") !== state.theme) root.setAttribute("data-theme", state.theme);
  }).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  applyTheme();

  // ---------- Lektor (synteza mowy przeglądarki) ----------
  const tts = (() => {
    // W aplikacji na Androida (WebView) Web Speech API nie istnieje — mowę daje most AndroidTTS.
    const native = window.AndroidTTS || null;
    const synth = window.speechSynthesis;
    const ok = !!native || (!!synth && typeof window.SpeechSynthesisUtterance !== "undefined");
    let voices = [];
    let gen = 0;
    let onVoices = null;
    // Najpierw głosy neuronowe / sieciowe (najbardziej naturalne), potem pozostałe.
    const RANK = [/natural|neural|online|network/i, /google/i, /premium|enhanced|siri/i, /microsoft/i];
    const score = (v) => RANK.reduce((acc, r, i) => acc + (r.test(v.name) ? (RANK.length - i) * 10 : 0), 0)
      + (v.network || v.localService === false ? 2 : 0) + (v.quality || 0) / 100;
    function load() {
      if (native) {
        try { voices = JSON.parse(native.voices() || "[]"); } catch (e) { voices = []; }
      } else if (synth) {
        voices = synth.getVoices().filter((v) => /^pl/i.test(v.lang));
      }
      voices.sort((a, b) => score(b) - score(a));
      if (onVoices) onVoices();
    }
    if (native) window.__ttsReady = load;
    if (ok) { load(); if (!native) synth.onvoiceschanged = load; }

    function voice() { return voices.find((v) => v.name === state.voice) || voices[0] || null; }
    // Krótsze fragmenty: niektóre silniki urywają długie wypowiedzi.
    function split(text) {
      const sentences = String(text).replace(/\s+/g, " ").match(/[^.!?]+[.!?„”"»)]*\s*/g) || [text];
      const out = [];
      for (const t of sentences) {
        if (out.length && (out[out.length - 1] + t).length < 180) out[out.length - 1] += t;
        else out.push(t);
      }
      return out.map((t) => t.trim()).filter(Boolean);
    }

    const pending = new Map();
    let seq = 0;
    window.__ttsDone = (id) => { const r = pending.get(id); if (r) { pending.delete(id); r(); } };
    function speakChunk(text) {
      if (native) {
        return new Promise((resolve) => {
          const id = "u" + (++seq);
          pending.set(id, resolve);
          const v = voice();
          native.speak(text, state.rate || 1, v ? v.name : "", id);
        });
      }
      return new Promise((resolve) => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "pl-PL";
        const v = voice();
        if (v) u.voice = v;
        u.rate = state.rate || 1;
        u.onend = resolve;
        u.onerror = resolve;
        synth.speak(u);
      });
    }
    function cancel() {
      if (native) native.stop(); else if (synth) synth.cancel();
      pending.forEach((r) => r());
      pending.clear();
    }
    async function speak(text) {
      if (!ok) return;
      cancel();
      const my = ++gen;
      for (const part of split(text)) {
        if (my !== gen) return;
        await speakChunk(part);
      }
    }
    function stop() { gen++; if (ok) cancel(); }
    return {
      ok, native: !!native, speak, stop, reload: load,
      voices: () => voices,
      current: voice,
      set onVoices(fn) { onVoices = fn; }
    };
  })();
  const pause = (ms) => new Promise((r) => setTimeout(r, ms));
  const ORD = ["pierwsza", "druga", "trzecia", "czwarta", "piąta"];
  let speechRun = 0; // zmiana przerywa trwające czytanie lektora

  function stopSpeech() { speechRun++; tts.stop(); }

  // „…owoc żywota Twojego, Jezus, <dopowiedzenie> Święta Maryjo…”
  const [HAIL_A, HAIL_B] = (() => {
    const t = PRAYERS.hailMary.text;
    const i = t.indexOf("Jezus.") + "Jezus".length;
    return [t.slice(0, i) + ",", t.slice(i + 1).trim()];
  })();
  const clText = (c) => c.replace(/\.$/, "");
  const fullTitle = (m) => `${m.t} (${m.sub})`;

  function updateProgress() {
    const n = state.done.length;
    document.getElementById("progress-fill").style.width = `${(n / TOTAL_DAYS) * 100}%`;
    document.getElementById("progress-text").textContent = `${n} / ${TOTAL_DAYS}`;
  }

  function setView(v) {
    if (AUTO.playing) autoPause();
    stopSpeech();
    view = v;
    document.querySelectorAll(".tabbar button").forEach((b) =>
      b.classList.toggle("active", b.dataset.view === v));
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    updateProgress();
    if (view === "settings") return renderSettings();
    if (view === "list") return renderList();
    if (view === "auto") return renderAuto();
    if (!state.start) return renderWelcome();
    if (view === "today") return renderToday();
  }

  function stageOverview() {
    return `<ol class="stages">${STAGES.map((st, i) => `
      <li><b>Etap ${ROMAN[i]}: ${esc(st.title)}</b><br><span>${esc(st.desc)}</span></li>`).join("")}</ol>`;
  }

  // ---------- Ekran powitalny ----------
  function renderWelcome() {
    app.innerHTML = `
      <section class="card">
        <p class="eyebrow">Witaj</p>
        <h2 class="mystery-title">175 dni z Historią Zbawienia</h2>
        <p class="med">Nowy Różaniec Historii Zbawienia to <b>7 etapów</b> zbudowanych na symetrii:
          Stary Testament (I–III) — Chrystus i Maryja w centrum (IV) — Dzieje Kościoła (V–VII).</p>
        <p class="med">Każdy etap to <b>5 części po 5 tajemnic</b> (25 dni). Każdego dnia rozważasz <b>jedną tajemnicę</b>
          i odmawiasz jedną dziesiątkę różańca. Cała droga trwa <b>175 dni</b>.</p>
        ${stageOverview()}
        <label class="field">Data rozpoczęcia
          <input type="date" id="start-input" value="${isoToday()}">
        </label>
        <button class="btn primary big" id="start-btn">Rozpocznij</button>
      </section>`;
    document.getElementById("start-btn").onclick = () => {
      const v = document.getElementById("start-input").value || isoToday();
      state.start = v;
      save();
      viewDay = null;
      setView("today");
    };
  }

  // ---------- Dziś ----------
  function renderToday() {
    const cal = calendarDay();
    const today = currentDay();
    const day = viewDay || today;
    const m = MYSTERIES[day - 1];
    const done = isDone(day);
    const isToday = day === today && cal >= 1 && cal <= TOTAL_DAYS;

    let notice = "";
    if (cal < 1) {
      notice = `Modlitwa rozpocznie się ${esc(fmtDate(parseIso(state.start)))}. Poniżej pierwsza tajemnica.`;
    } else if (cal > TOTAL_DAYS) {
      notice = state.done.length === TOTAL_DAYS
        ? "Chwała Panu! Ukończyłeś/aś wszystkie 175 tajemnic Różańca Historii Zbawienia."
        : `Okres 175 dni minął. Pozostało ${TOTAL_DAYS - state.done.length} nieodmówionych tajemnic — możesz je nadrobić.`;
    } else {
      const missed = [];
      for (let d = 1; d < cal; d++) if (!isDone(d)) missed.push(d);
      if (missed.length) {
        notice = `Zaległe tajemnice: ${missed.length}. <a href="#" id="goto-missed">Przejdź do dnia ${missed[0]}</a>`;
      }
    }

    const st = STAGES[m.stage - 1];
    const stageStart = MYSTERIES.find((x) => x.stage === m.stage).day;
    const stageIntro = day === stageStart ? `
      <section class="card stage-intro">
        <p class="eyebrow">Rozpoczyna się etap ${ROMAN[m.stage - 1]} z 7</p>
        <h2 class="mystery-title">${esc(st.title)}</h2>
        <p class="med" style="margin:0">${esc(st.desc)}</p>
      </section>` : "";

    app.innerHTML = `
      ${notice ? `<p class="notice">${notice}</p>` : ""}
      ${stageIntro}
      <section class="card">
        <div class="row spread" style="margin-bottom:8px">
          <span class="badge">Dzień ${day} z ${TOTAL_DAYS}${isToday ? " · dziś" : ""}</span>
          ${done ? '<span class="badge done">✓ Odmówione</span>' : ""}
        </div>
        <p class="eyebrow">Etap ${ROMAN[m.stage - 1]}: ${esc(st.short)} · dzień ${day - stageStart + 1}/25</p>
        <p class="part-line">Część ${m.part}: ${esc(m.partTitle)} · Tajemnica ${ROMAN[m.inPart - 1]}</p>
        <h2 class="mystery-title">${esc(m.t)}</h2>
        <p class="sub">(${esc(m.sub)})</p>
        <p class="ref">${esc(m.ref)} · ${esc(fmtDate(dateOfDay(day)))}</p>
        <p class="med">${esc(m.med)}</p>
        ${hasOpening(day) && state.opening ? `
        <details class="cl-box">
          <summary>Wstęp do różańca</summary>
          <p class="cl-lead">Znak krzyża, Witaj, Królowo, Wierzę w Boga, Ojcze nasz, 3 × Zdrowaś Maryjo… Jezus:</p>
          <ol class="cl-list">${INTRO_CL.map((c) => `<li>${esc(c)}</li>`).join("")}</ol>
          <p class="cl-lead">Chwała Ojcu.</p>
        </details>` : ""}
        <details class="cl-box">
          <summary>Dopowiedzenia do „Zdrowaś Maryjo” (10)</summary>
          <p class="cl-lead">…błogosławiony owoc żywota Twojego, Jezus:</p>
          <ol class="cl-list">${m.cl.map((c) => `<li>${esc(c)}</li>`).join("")}</ol>
        </details>
        ${m.inPart === 5 ? `
        <details class="cl-box">
          <summary>Modlitwa na zakończenie części</summary>
          <p class="med">${esc(PARTS[m.part - 1].prayer)}</p>
        </details>` : ""}
      </section>
      <button class="btn primary big" id="pray-btn">${done ? "Odmów ponownie" : "Rozpocznij modlitwę"}</button>
      ${tts.ok ? `<button class="btn big listen" id="listen-btn">🔊 Odsłuchaj rozważanie</button>` : ""}
      <div class="row spread" style="margin-top:12px">
        <button class="btn ghost" id="prev" ${day <= 1 ? "disabled" : ""}>← Poprzednia</button>
        <button class="btn ghost" id="next" ${day >= TOTAL_DAYS ? "disabled" : ""}>Następna →</button>
      </div>
      <p style="text-align:center"><button class="btn ghost" id="toggle">${done ? "Cofnij oznaczenie" : "Oznacz jako odmówione"}</button></p>
      ${day !== today ? `<p style="text-align:center"><button class="btn ghost" id="back-today">Wróć do dnia bieżącego (${today})</button></p>` : ""}`;

    document.getElementById("pray-btn").onclick = () => startPrayer(day);
    const lb = document.getElementById("listen-btn");
    if (lb) lb.onclick = async () => {
      if (lb.dataset.on) { stopSpeech(); lb.textContent = "🔊 Odsłuchaj rozważanie"; delete lb.dataset.on; return; }
      stopSpeech();
      const my = speechRun;
      lb.dataset.on = "1"; lb.textContent = "■ Zatrzymaj lektora";
      await tts.speak(`${m.partTitle}. Tajemnica ${ORD[m.inPart - 1]}: ${m.t}. ${m.sub}. ${m.med}`);
      if (my === speechRun && lb.isConnected) { lb.textContent = "🔊 Odsłuchaj rozważanie"; delete lb.dataset.on; }
    };
    document.getElementById("prev").onclick = () => { viewDay = day - 1; renderToday(); };
    document.getElementById("next").onclick = () => { viewDay = day + 1; renderToday(); };
    document.getElementById("toggle").onclick = () => { setDone(day, !done); render(); };
    const bt = document.getElementById("back-today");
    if (bt) bt.onclick = () => { viewDay = null; renderToday(); };
    const gm = document.getElementById("goto-missed");
    if (gm) gm.onclick = (e) => {
      e.preventDefault();
      viewDay = [...Array(cal - 1).keys()].map((i) => i + 1).find((d) => !isDone(d));
      renderToday();
    };
  }

  // Wersja pełna: wstęp i „Pod Twoją obronę” każdego dnia.
  // Wersja krótsza: wstęp tylko przed 1. tajemnicą, „Pod Twoją obronę” tylko po 175.
  const hasOpening = (day) => !state.short || day === 1;
  const hasClosing = (day) => state.closing && (!state.short || day === TOTAL_DAYS);

  // ---------- Modlitwa krok po kroku ----------
  function buildSteps(m) {
    const P = PRAYERS;
    const steps = [{ kind: "text", title: P.sign.name, body: P.sign.text }];
    if (hasOpening(m.day)) steps.push({ kind: "text", title: P.salveRegina.name, body: P.salveRegina.text });
    if (hasOpening(m.day) && state.opening) {
      steps.push({ kind: "text", title: P.creed.name, body: P.creed.text });
      steps.push({ kind: "text", title: `Wstęp · ${P.ourFather.name}`, body: P.ourFather.text });
      steps.push({ kind: "beads", title: `Wstęp · ${P.hailMary.name} (3×)`, cl: INTRO_CL, done: "Wstęp odmówiony" });
      steps.push({ kind: "text", title: `Wstęp · ${P.glory.name}`, body: P.glory.text });
    }
    steps.push({
      kind: "mystery",
      title: `${m.partTitle} · Tajemnica ${ROMAN[m.inPart - 1]}: ${fullTitle(m)}`,
      body: `<p class="ref">${esc(m.ref)}</p>
             <p>${esc(m.med)}</p>
             <p class="notice">Możesz przeczytać wskazany fragment Pisma Świętego i chwilę pomilczeć.</p>`,
      say: `${m.partTitle}. Tajemnica ${ORD[m.inPart - 1]}: ${m.t}. ${m.sub}. ${m.med}`
    });
    steps.push({ kind: "text", title: P.ourFather.name, body: P.ourFather.text });
    steps.push({ kind: "beads", title: `${P.hailMary.name} (10×)`, cl: m.cl, done: "Dziesiątka zakończona" });
    steps.push({ kind: "text", title: P.glory.name, body: P.glory.text });
    steps.push({ kind: "text", title: P.fatima.name, body: P.fatima.text });
    if (m.inPart === 5) {
      steps.push({ kind: "text", title: `Modlitwa na zakończenie: ${m.partTitle}`, body: PARTS[m.part - 1].prayer });
    }
    if (hasClosing(m.day)) steps.push({ kind: "text", title: P.salve.name, body: P.salve.text });
    steps.push({ kind: "text", title: P.sign.name, body: P.sign.text });
    return steps;
  }

  function startPrayer(day) {
    stopSpeech();
    const m = MYSTERIES[day - 1];
    const steps = buildSteps(m);
    let i = 0;
    const counts = steps.map(() => 0); // odmówione „Zdrowaś Maryjo” w każdym kroku z paciorkami
    let auto = false;
    const hailSpeech = (c) => `${HAIL_A} ${clText(c)}. ${HAIL_B}`;

    function stopAuto() { auto = false; stopSpeech(); }

    // Lektor prowadzi całą dziesiątkę: czyta krok, przechodzi dalej, liczy „Zdrowaś Maryjo”.
    async function autoRun() {
      stopSpeech();
      const my = speechRun;
      auto = true;
      show();
      const alive = () => auto && my === speechRun;
      while (alive()) {
        const s = steps[i];
        if (s.kind === "beads") {
          while (counts[i] < s.cl.length) {
            await tts.speak(hailSpeech(s.cl[counts[i]]));
            if (!alive()) return;
            counts[i]++;
            show();
          }
        } else {
          await tts.speak(s.say || s.body);
          if (!alive()) return;
        }
        await pause(700);
        if (!alive()) return;
        if (i === steps.length - 1) { auto = false; setDone(m.day, true); finish(m); return; }
        i++;
        show();
        window.scrollTo(0, 0);
      }
    }

    function show() {
      const s = steps[i];
      const dots = steps.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("");
      let content;
      const count = counts[i];
      if (s.kind === "beads") {
        const n = s.cl.length;
        const beads = Array.from({ length: n }, (_, k) => `<span class="bead ${k < count ? "on" : ""}"></span>`).join("");
        const cur = Math.min(count, n - 1);
        content = `
          <div class="beads" aria-hidden="true">${beads}</div>
          ${count < n ? `
          <p class="hail">${esc(HAIL_A)} <b class="cl-now">${esc(clText(s.cl[cur]))}.</b> ${esc(HAIL_B)}</p>` : ""}
          <button class="tap-area" id="tap">
            <span class="count">${count} / ${n}</span>
            ${count < n ? (auto ? "Lektor prowadzi modlitwę…" : "Dotknij po odmówieniu tego „Zdrowaś Maryjo”") : s.done}
          </button>
          <ol class="cl-list">${s.cl.map((c, k) => `<li class="${k < count ? "said" : k === cur && count < n ? "now" : ""}">${esc(c)}</li>`).join("")}</ol>`;
      } else if (s.kind === "mystery") {
        content = s.body;
      } else {
        content = `<p>${esc(s.body)}</p>`;
      }
      const last = i === steps.length - 1;
      const blockNext = s.kind === "beads" && count < s.cl.length;
      app.innerHTML = `
        <div class="steps-dots">${dots}</div>
        ${tts.ok ? `<button class="btn big listen ${auto ? "on" : ""}" id="auto-btn">${auto ? "■ Zatrzymaj lektora" : "🔊 Lektor prowadzi modlitwę"}</button>` : ""}
        <section class="card prayer-step">
          <p class="eyebrow">Dzień ${m.day} · Etap ${ROMAN[m.stage - 1]} · ${esc(m.partTitle)}</p>
          <h3>${esc(s.title)}</h3>
          ${content}
        </section>
        <div class="row spread">
          <button class="btn" id="p-back">${i === 0 ? "Zakończ" : "← Wstecz"}</button>
          <button class="btn primary" id="p-next" ${blockNext ? "disabled" : ""}>${last ? "Amen ✓" : "Dalej →"}</button>
        </div>`;

      const ab = document.getElementById("auto-btn");
      if (ab) ab.onclick = () => { if (auto) { stopAuto(); show(); } else autoRun(); };
      const tap = document.getElementById("tap");
      if (tap) tap.onclick = () => {
        if (auto) stopAuto();
        if (counts[i] < s.cl.length) { counts[i]++; if (navigator.vibrate) navigator.vibrate(15); }
        show();
      };
      document.getElementById("p-back").onclick = () => {
        stopAuto();
        if (i === 0) { renderToday(); return; }
        i--; show();
      };
      document.getElementById("p-next").onclick = () => {
        stopAuto();
        if (last) { setDone(m.day, true); finish(m); return; }
        i++; show(); window.scrollTo(0, 0);
      };
    }
    show();
  }

  function finish(m) {
    updateProgress();
    const next = m.day < TOTAL_DAYS ? MYSTERIES[m.day] : null;
    app.innerHTML = `
      <section class="card" style="text-align:center">
        <p class="eyebrow">Bóg zapłać</p>
        <h2 class="mystery-title">Tajemnica ${m.day} odmówiona</h2>
        <p class="med">${esc(m.partTitle)} · <i>${esc(fullTitle(m))}</i></p>
        ${next ? `<p class="notice">Następna tajemnica (dzień ${next.day}): <b>${esc(fullTitle(next))}</b></p>`
               : `<p class="med">To była ostatnia tajemnica. Chwała Ojcu i Synowi, i Duchowi Świętemu!</p>`}
        <button class="btn primary big" id="fin">Gotowe</button>
      </section>`;
    document.getElementById("fin").onclick = () => { viewDay = null; setView("today"); };
  }

  // ---------- Lista ----------
  function renderList() {
    const today = currentDay();
    const todayPart = MYSTERIES[today - 1].part;
    const partHtml = (p, pi) => {
      const items = MYSTERIES.filter((m) => m.part === pi + 1);
      const nDone = items.filter((m) => isDone(m.day)).length;
      return `
        <details class="card part" ${pi + 1 === todayPart ? "open" : ""}>
          <summary>
            <span class="ptitle">${pi + 1}. ${esc(p.title)}</span>
            <span class="pcount">${nDone}/5 · dni ${items[0].day}–${items[4].day}</span>
          </summary>
          <ol>
            ${items.map((m) => `
              <li class="${isDone(m.day) ? "done" : ""} ${m.day === today ? "today" : ""}">
                <button data-day="${m.day}">
                  <span class="num">${m.day}</span>
                  <span class="lt">${esc(m.t)}<small>${esc(m.sub)}</small></span>
                  <span class="st">${isDone(m.day) ? "✓" : m.day === today ? "•" : ""}</span>
                </button>
              </li>`).join("")}
          </ol>
          <details class="part-prayer">
            <summary>Modlitwa na zakończenie</summary>
            <p>${esc(p.prayer)}</p>
          </details>
        </details>`;
    };
    app.innerHTML = STAGES.map((st, si) => {
      const stDone = MYSTERIES.filter((m) => m.stage === si + 1 && isDone(m.day)).length;
      return `
        <h2 class="stage-head">Etap ${ROMAN[si]}: ${esc(st.title)} <span>${stDone}/25</span></h2>
        <p class="stage-desc">${esc(st.desc)}</p>
        ${PARTS.map((p, pi) => p.stage === si + 1 ? partHtml(p, pi) : "").join("")}`;
    }).join("");
    app.querySelectorAll("button[data-day]").forEach((b) => {
      b.onclick = () => { viewDay = Number(b.dataset.day); setView("today"); };
    });
    const open = app.querySelector("details[open]");
    if (open) requestAnimationFrame(() => open.scrollIntoView({ block: "start" }));
  }

  // ---------- Wersja modlitwy: pełna / krótsza ----------
  function versionSeg(prefix) {
    return `
      <div class="seg" role="group" aria-label="Wersja modlitwy">
        <button class="btn ${!state.short ? "primary" : ""}" id="${prefix}-full" aria-pressed="${!state.short}">Pełna</button>
        <button class="btn ${state.short ? "primary" : ""}" id="${prefix}-short" aria-pressed="${!!state.short}">Krótsza</button>
      </div>
      <p class="notice" style="margin-top:8px">${state.short
        ? "Wstęp (Witaj, Królowo, Wierzę w Boga, Ojcze nasz, 3 × Zdrowaś Maryjo, Chwała Ojcu) tylko przed 1. tajemnicą; „Pod Twoją obronę” tylko raz, po 175. tajemnicy."
        : "Każdego dnia: znak krzyża, Witaj, Królowo, Wierzę w Boga, wstęp, tajemnica, Pod Twoją obronę."}</p>`;
  }
  function bindVersionSeg(prefix, after) {
    const set = (v) => { if (state.short === v) return; state.short = v; save(); autoWordsCache = null; after(); };
    document.getElementById(prefix + "-full").onclick = () => set(false);
    document.getElementById(prefix + "-short").onclick = () => set(true);
  }

  // ---------- Auto: lektor czyta bez przerwy tajemnice 1–175 ----------
  const AUTO = { playing: false, day: state.autoDay || 1, seg: state.autoSeg || 0, msg: "" };
  let wakeLock = null;

  // Kolejne fragmenty jednej tajemnicy (jak w modlitwie krok po kroku).
  function autoSegments(day) {
    const m = MYSTERIES[day - 1];
    const P = PRAYERS;
    const st = STAGES[m.stage - 1];
    const segs = [];
    if (hasOpening(day)) {
      segs.push({ label: P.sign.name, text: P.sign.text });
      segs.push({ label: P.salveRegina.name, text: P.salveRegina.text });
      if (state.opening) {
        segs.push({ label: P.creed.name, text: P.creed.text });
        segs.push({ label: `Wstęp · ${P.ourFather.name}`, text: P.ourFather.text });
        INTRO_CL.forEach((c, k) => segs.push({ label: `Wstęp · ${P.hailMary.name} ${k + 1}/3`, text: `${HAIL_A} ${clText(c)}. ${HAIL_B}` }));
        segs.push({ label: `Wstęp · ${P.glory.name}`, text: P.glory.text });
      }
    }
    if (MYSTERIES.find((x) => x.stage === m.stage).day === day) {
      segs.push({ label: `Etap ${ROMAN[m.stage - 1]}`, text: `Etap ${ORD_STAGE[m.stage - 1]}: ${st.title}. ${st.desc}` });
    }
    segs.push({ label: "Tajemnica", text: `${m.partTitle}. Tajemnica ${ORD[m.inPart - 1]}: ${m.t}. ${m.sub}. ${m.med}` });
    segs.push({ label: P.ourFather.name, text: P.ourFather.text });
    m.cl.forEach((c, k) => segs.push({ label: `${P.hailMary.name} ${k + 1}/10`, text: `${HAIL_A} ${clText(c)}. ${HAIL_B}`, cl: k }));
    segs.push({ label: P.glory.name, text: P.glory.text });
    segs.push({ label: P.fatima.name, text: P.fatima.text });
    if (m.inPart === 5) segs.push({ label: "Modlitwa na zakończenie części", text: PARTS[m.part - 1].prayer });
    if (day === TOTAL_DAYS || !state.short) {
      if (hasClosing(day)) segs.push({ label: P.salve.name, text: P.salve.text });
      segs.push({ label: P.sign.name, text: P.sign.text });
    }
    return segs;
  }
  const ORD_STAGE = ["pierwszy", "drugi", "trzeci", "czwarty", "piąty", "szósty", "siódmy"];

  // Szacowany czas całości (ok. 150 słów na minutę przy tempie 100%).
  let autoWordsCache = null;
  function autoHours() {
    if (autoWordsCache === null) {
      autoWordsCache = 0;
      for (let d = 1; d <= TOTAL_DAYS; d++) autoSegments(d).forEach((g) => { autoWordsCache += g.text.split(/\s+/).length; });
    }
    return autoWordsCache / 150 / (state.rate || 1) / 60;
  }

  function saveAutoPos() { state.autoDay = AUTO.day; state.autoSeg = AUTO.seg; save(); }

  async function keepAwake(on) {
    if (tts.native && window.AndroidTTS.keepAwake) { try { window.AndroidTTS.keepAwake(on); } catch (e) { /* starsza wersja */ } }
    try {
      if (on && state.autoAwake && navigator.wakeLock && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) { wakeLock = null; }
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && AUTO.playing) keepAwake(true);
  });

  async function autoPlay() {
    stopSpeech();
    const my = speechRun;
    AUTO.playing = true;
    AUTO.msg = "";
    keepAwake(true);
    const alive = () => AUTO.playing && my === speechRun;
    // Wznowienie w środku: zacznij od znaku krzyża, jeśli to nie początek całości.
    if (!(AUTO.day === 1 && AUTO.seg === 0) && AUTO.seg === 0 && state.short) {
      renderAutoIfVisible();
      await tts.speak(PRAYERS.sign.text);
      if (!alive()) return;
    }
    while (alive() && AUTO.day <= TOTAL_DAYS) {
      const segs = autoSegments(AUTO.day);
      if (AUTO.seg >= segs.length) AUTO.seg = 0;
      while (AUTO.seg < segs.length) {
        renderAutoIfVisible();
        await tts.speak(segs[AUTO.seg].text);
        if (!alive()) return;
        await pause(600);
        if (!alive()) return;
        AUTO.seg++;
        saveAutoPos();
      }
      AUTO.day++;
      AUTO.seg = 0;
      saveAutoPos();
    }
    if (AUTO.day > TOTAL_DAYS) {
      AUTO.playing = false;
      AUTO.day = 1; AUTO.seg = 0; saveAutoPos();
      AUTO.msg = "Lektor przeczytał wszystkie 175 tajemnic. Chwała Panu!";
      keepAwake(false);
      renderAutoIfVisible();
    }
  }
  function autoPause() {
    AUTO.playing = false;
    stopSpeech();
    keepAwake(false);
    saveAutoPos();
  }
  function autoJump(day) {
    const wasPlaying = AUTO.playing;
    if (wasPlaying) autoPause();
    AUTO.day = Math.min(Math.max(day, 1), TOTAL_DAYS);
    AUTO.seg = 0;
    AUTO.msg = "";
    saveAutoPos();
    if (wasPlaying) autoPlay(); else renderAutoIfVisible();
  }
  function renderAutoIfVisible() { if (view === "auto") renderAuto(); }

  function renderAuto() {
    const m = MYSTERIES[AUTO.day - 1];
    const segs = autoSegments(AUTO.day);
    const seg = segs[Math.min(AUTO.seg, segs.length - 1)];
    const hours = autoHours();
    const pct = ((AUTO.day - 1 + AUTO.seg / segs.length) / TOTAL_DAYS) * 100;
    app.innerHTML = `
      <section class="card">
        <p class="eyebrow">Auto · cały różaniec</p>
        <h2 class="mystery-title">Tajemnice 1–175 bez przerwy</h2>
        <p class="notice" style="margin:0">Lektor czyta po kolei wszystkie tajemnice: zapowiedź i rozważanie, Ojcze nasz,
          10 × Zdrowaś Maryjo z dopowiedzeniami, Chwała Ojcu i O mój Jezu, a na końcu każdej części jej modlitwę.
          ${state.short ? "Wersja krótsza: wstęp tylko na początku, „Pod Twoją obronę” tylko po 175. tajemnicy. " : "Wersja pełna: każdą tajemnicę poprzedza wstęp (Witaj, Królowo, Wierzę w Boga, Ojcze nasz, 3 × Zdrowaś Maryjo, Chwała Ojcu). "}Całość trwa około ${Math.round(hours)} godzin — możesz przerwać w dowolnej chwili i wrócić później w to samo miejsce.</p>
      </section>
      ${!tts.ok ? `<p class="notice">Ta przeglądarka nie obsługuje lektora. Użyj Chrome, Edge, Safari albo aplikacji na Androida.</p>` : ""}
      <section class="card now ${AUTO.playing ? "playing" : ""}">
        <div class="row spread">
          <span class="badge">Tajemnica ${AUTO.day} z ${TOTAL_DAYS}</span>
          <span class="badge ${AUTO.playing ? "done" : ""}">${AUTO.playing ? "● Czyta" : "Pauza"}</span>
        </div>
        <div class="auto-bar" aria-hidden="true"><span style="width:${pct.toFixed(2)}%"></span></div>
        <p class="eyebrow" style="margin-top:10px">Etap ${ROMAN[m.stage - 1]} · ${esc(m.partTitle)} · Tajemnica ${ROMAN[m.inPart - 1]}</p>
        <h2 class="mystery-title">${esc(m.t)}</h2>
        <p class="sub">(${esc(m.sub)})</p>
        <p class="seg-label">${esc(seg.label)}</p>
        <p class="seg-text">${esc(seg.text)}</p>
        ${AUTO.msg ? `<p class="notice"><b>${esc(AUTO.msg)}</b></p>` : ""}
        <div class="player" role="group" aria-label="Sterowanie lektorem">
          <button class="btn ghost" id="a-prev" ${AUTO.day <= 1 ? "disabled" : ""} aria-label="Poprzednia tajemnica">⏮</button>
          <button class="btn primary play" id="a-play" ${tts.ok ? "" : "disabled"}>${AUTO.playing ? "⏸ Pauza" : (AUTO.day === 1 && AUTO.seg === 0 ? "▶ Start" : "▶ Wznów")}</button>
          <button class="btn ghost" id="a-next" ${AUTO.day >= TOTAL_DAYS ? "disabled" : ""} aria-label="Następna tajemnica">⏭</button>
        </div>
      </section>
      <section class="card">
        <p class="eyebrow">Skąd czytać</p>
        <div class="row">
          <label class="field" style="margin:0">Od tajemnicy nr
            <input type="number" id="a-from" min="1" max="${TOTAL_DAYS}" value="${AUTO.day}" inputmode="numeric">
          </label>
          <button class="btn" id="a-go">Przejdź</button>
          <button class="btn ghost" id="a-start">Od początku</button>
          <button class="btn ghost" id="a-today">Od dzisiejszej (${currentDay()})</button>
        </div>
        <p class="eyebrow" style="margin-top:16px">Wersja modlitwy</p>
        ${versionSeg("a")}
        <label class="check" style="margin-top:12px"><input type="checkbox" id="a-awake" ${state.autoAwake ? "checked" : ""}> Nie wygaszaj ekranu podczas czytania</label>
        <p class="notice">Głos i tempo ustawisz w zakładce Ustawienia. Gdy telefon się zablokuje, przeglądarka może zatrzymać lektora — wtedy stuknij „Wznów”.</p>
      </section>`;
    const playBtn = document.getElementById("a-play");
    playBtn.onclick = () => { if (AUTO.playing) { autoPause(); renderAuto(); } else autoPlay(); };
    document.getElementById("a-prev").onclick = () => autoJump(AUTO.day - 1);
    document.getElementById("a-next").onclick = () => autoJump(AUTO.day + 1);
    document.getElementById("a-go").onclick = () => {
      const v = parseInt(document.getElementById("a-from").value, 10);
      if (v >= 1 && v <= TOTAL_DAYS) autoJump(v);
    };
    document.getElementById("a-start").onclick = () => autoJump(1);
    document.getElementById("a-today").onclick = () => autoJump(currentDay());
    bindVersionSeg("a", () => { if (AUTO.playing) autoPause(); AUTO.seg = 0; saveAutoPos(); renderAuto(); });
    document.getElementById("a-awake").onchange = (e) => {
      state.autoAwake = e.target.checked; save();
      if (AUTO.playing) keepAwake(e.target.checked);
    };
  }

  // ---------- Instalacja: Android (APK/AAB), iOS i PWA ----------
  const IS_ANDROID_APP = tts.native;
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const IS_STANDALONE = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  // Pliki do pobrania: w wersji opublikowanej wbudowane w stronę (window.RHZ_DOWNLOADS),
  // w wersji z serwera — katalog downloads/.
  const DL = window.RHZ_DOWNLOADS || null;
  let installPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; });

  function installSection() {
    if (IS_ANDROID_APP) {
      return `<section class="card"><p class="eyebrow">Aplikacja</p>
        <p class="notice">Używasz aplikacji na Androida (wersja ${esc(window.RHZ_VERSION || "1.0.0")}).</p></section>`;
    }
    return `
      <section class="card" id="install">
        <p class="eyebrow">Instalacja na telefonie</p>
        <div class="dl">
          <h3>Android — aplikacja (.apk)</h3>
          <p class="notice">Instalacja bez Sklepu Play. Lektor korzysta z polskiego głosu telefonu.</p>
          <button class="btn primary" data-dl="apk">⬇ Pobierz aplikację na Androida</button>
          <details><summary>Jak zainstalować</summary>
            <ol class="steps">
              <li>Pobierz plik i otwórz go z powiadomienia lub w aplikacji <i>Pliki</i>${DL ? " (to archiwum .zip — najpierw je rozpakuj, potem otwórz plik .apk)" : ""}.</li>
              <li>Gdy telefon zapyta, zezwól na instalowanie aplikacji z tego źródła.</li>
              <li>Stuknij <b>Zainstaluj</b>. Ikona „Różaniec HZ” pojawi się na ekranie.</li>
            </ol>
            <p class="notice">Postęp z przeglądarki nie przenosi się do aplikacji — ustaw w niej tę samą datę rozpoczęcia.</p>
          </details>
        </div>
        <div class="dl">
          <h3>Android — Google Play (.aab)</h3>
          <p class="notice">Pakiet do wgrania w Google Play Console, jeśli chcesz opublikować aplikację w Sklepie Play.</p>
          <button class="btn" data-dl="aab">⬇ Pobierz pakiet .aab</button>
        </div>
        <div class="dl">
          <h3>iPhone i iPad</h3>
          <p class="notice">Plik .ipa może zbudować i podpisać tylko komputer Mac z kontem Apple Developer, a zainstalować — App Store lub TestFlight.
            Na iPhonie dodaj aplikację do ekranu początkowego (PWA):</p>
          <ol class="steps">
            <li>Otwórz tę stronę w <b>Safari</b>.</li>
            <li>Stuknij <b>Udostępnij</b> (kwadrat ze strzałką).</li>
            <li>Wybierz <b>Do ekranu początk.</b> i potwierdź <b>Dodaj</b>.</li>
          </ol>
        </div>
        <div class="dl">
          <h3>PWA — aplikacja z przeglądarki</h3>
          ${IS_STANDALONE ? `<p class="notice">Aplikacja jest już zainstalowana jako PWA.</p>` : `
          <p class="notice">Na Androidzie i komputerze (Chrome, Edge) możesz zainstalować aplikację prosto z przeglądarki.</p>
          <button class="btn" id="pwa-btn">＋ Zainstaluj jako aplikację</button>
          <p class="notice" id="pwa-note"></p>`}
        </div>
        <p class="notice" id="dl-msg" role="status"></p>
      </section>`;
  }

  // Książka PDF (wersja krótsza) do druku w Amazon KDP.
  const BOOK_FILES = {
    book: { file: "downloads/rozaniec-hz-ksiazka-kdp.pdf", name: "Rozaniec-HZ-ksiazka-KDP-6x9.pdf" },
    cover: { file: "downloads/rozaniec-hz-okladka-kdp.pdf", name: "Rozaniec-HZ-okladka-KDP.pdf" }
  };
  function bookSection() {
    return `
      <section class="card" id="book">
        <p class="eyebrow">Książka do druku</p>
        <h3 class="book-h">Wersja krótsza jako książka (Amazon KDP)</h3>
        <p class="notice">Plik PDF gotowy do wydania w Amazon KDP jako książka w miękkiej oprawie: format 6 × 9 cali, ok. 400 stron,
          druk czarno-biały, papier biały. Pełna treść wersji krótszej dzień po dniu — wszystkie modlitwy wypisane w całości,
          każde „Zdrowaś Maryjo” z dopowiedzeniem, bez skrótów; spis treści.</p>
        ${IS_ANDROID_APP ? `<p class="notice">Pliki pobierzesz ze strony internetowej aplikacji (Ustawienia → Książka do druku).</p>` : `
        <div class="row">
          <button class="btn primary" data-book="book">⬇ Wnętrze książki (PDF)</button>
          <button class="btn" data-book="cover">⬇ Okładka (PDF)</button>
        </div>
        <details><summary>Jak wydać w Amazon KDP</summary>
          <ol class="steps">
            <li>Zaloguj się na <b>kdp.amazon.com</b> i wybierz <b>Create → Paperback</b>.</li>
            <li>Wpisz tytuł „Różaniec Historii Zbawienia”, podtytuł, autora i opis; język: polski.</li>
            <li>ISBN: możesz wybrać bezpłatny ISBN od KDP.</li>
            <li>Ustawienia druku: <b>Black &amp; white interior, white paper</b>, rozmiar <b>6 × 9 in</b>, <b>No bleed</b>, okładka matowa lub błyszcząca.</li>
            <li>Manuscript: wgraj plik „wnętrze książki”. Cover: wybierz <b>Upload a cover you already have</b> i wgraj „okładkę”.</li>
            <li>Sprawdź książkę w <b>Launch Previewer</b>, ustaw cenę i opublikuj.</li>
          </ol>
          <p class="notice">KDP pyta, czy treść powstała z pomocą AI — zaznacz to zgodnie z prawdą. Grzbiet okładki jest policzony na liczbę stron tej książki na białym papierze;
            przy innym papierze grzbiet ma inną szerokość.</p>
        </details>`}
        <p class="notice" id="book-msg" role="status"></p>
      </section>`;
  }
  function bindBook() {
    const msg = document.getElementById("book-msg");
    app.querySelectorAll("[data-book]").forEach((b) => {
      b.onclick = async () => {
        const f = BOOK_FILES[b.dataset.book];
        if (DL && DL[b.dataset.book]) {
          const downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
          if (!downloads) { msg.textContent = "Pobieranie nie jest dostępne w tym widoku. Otwórz stronę w przeglądarce."; return; }
          const bin = Uint8Array.from(atob(DL[b.dataset.book].pdf), (c) => c.charCodeAt(0));
          try {
            await downloads.save({ filename: f.name, data: new Blob([bin]) });
            msg.textContent = "Pobrano: " + f.name;
          } catch (e) {
            if (!e || e.code !== "declined") msg.textContent = "Nie udało się pobrać pliku (" + ((e && e.code) || "błąd") + ").";
          }
          return;
        }
        const a = document.createElement("a");
        a.href = f.file; a.download = f.name;
        document.body.appendChild(a); a.click(); a.remove();
      };
    });
  }

  function bindInstall() {
    const msg = document.getElementById("dl-msg");
    const say = (t) => { if (msg) msg.textContent = t; };
    app.querySelectorAll("[data-dl]").forEach((b) => {
      b.onclick = async () => {
        const kind = b.dataset.dl;
        if (DL) {
          // Opublikowana strona: zapis przez platformę (dozwolone .zip).
          const downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
          if (!downloads) { say("Pobieranie nie jest dostępne w tym widoku. Otwórz stronę w przeglądarce."); return; }
          const bin = Uint8Array.from(atob(DL[kind].zip), (c) => c.charCodeAt(0));
          try {
            await downloads.save({ filename: DL[kind].name, data: new Blob([bin]) });
            say(kind === "apk" ? "Pobrano. Rozpakuj archiwum i otwórz plik .apk." : "Pobrano pakiet .aab (w archiwum .zip).");
          } catch (e) {
            if (e && e.code === "declined") return;
            say("Nie udało się pobrać pliku (" + ((e && e.code) || "błąd") + ").");
          }
          return;
        }
        // Wersja z serwera: zwykłe pobranie pliku.
        const a = document.createElement("a");
        a.href = kind === "apk" ? "downloads/rozaniec-historii-zbawienia.apk" : "downloads/rozaniec-historii-zbawienia.aab";
        a.download = "";
        document.body.appendChild(a); a.click(); a.remove();
      };
    });
    const pwa = document.getElementById("pwa-btn");
    if (pwa) pwa.onclick = async () => {
      const note = document.getElementById("pwa-note");
      if (installPrompt) {
        installPrompt.prompt();
        const r = await installPrompt.userChoice;
        installPrompt = null;
        note.textContent = r.outcome === "accepted" ? "Zainstalowano." : "";
      } else if (IS_IOS) {
        note.textContent = "Na iPhonie użyj przycisku Udostępnij → Do ekranu początk. (instrukcja wyżej).";
      } else {
        note.textContent = "Przeglądarka nie zaproponowała instalacji. Otwórz menu przeglądarki (⋮) i wybierz „Zainstaluj aplikację” lub „Dodaj do ekranu głównego”.";
      }
    };
  }

  // ---------- Ustawienia ----------
  function renderSettings() {
    const end = dateOfDay(TOTAL_DAYS);
    app.innerHTML = `
      <section class="card">
        <p class="eyebrow">Plan modlitwy</p>
        <label class="field">Data rozpoczęcia
          <input type="date" id="s-start" value="${esc(state.start || isoToday())}">
        </label>
        ${!state.start ? `<button class="btn primary" id="s-start-confirm" style="margin-top:4px;margin-bottom:10px">Rozpocznij modlitwę od tej daty</button>` : ""}
        <p class="notice">Zakończenie: ${esc(fmtDate(end))} (dzień ${TOTAL_DAYS}).</p>
        <p class="eyebrow" style="margin-top:4px">Wersja modlitwy</p>
        ${versionSeg("s")}
        <label class="check"><input type="checkbox" id="s-open" ${state.opening ? "checked" : ""}> Wstęp z „Wierzę w Boga” (Ojcze nasz, 3 × Zdrowaś Maryjo: wiary, nadziei, miłości; Chwała Ojcu)</label>
        <label class="check"><input type="checkbox" id="s-close" ${state.closing ? "checked" : ""}> Odmawiaj „Pod Twoją obronę”</label>
      </section>
      <section class="card">
        <p class="eyebrow">Wygląd</p>
        <div class="seg" role="group" aria-label="Motyw">
          <button class="btn ${state.theme === "light" ? "primary" : ""}" data-theme-set="light">☀ Jasny</button>
          <button class="btn ${state.theme === "dark" ? "primary" : ""}" data-theme-set="dark">☾ Ciemny</button>
          <button class="btn ${!state.theme ? "primary" : ""}" data-theme-set="">Systemowy</button>
        </div>
      </section>
      <section class="card">
        <p class="eyebrow">Lektor</p>
        ${tts.ok ? `
        <label class="field">Głos
          <select id="s-voice"></select>
        </label>
        <p class="notice" id="s-voice-note"></p>
        <label class="field">Tempo czytania: <span id="s-rate-val">${Math.round((state.rate || 1) * 100)}%</span>
          <input type="range" id="s-rate" min="0.6" max="1.4" step="0.05" value="${state.rate || 1}">
        </label>
        <div class="row">
          <button class="btn" id="s-test">🔊 Posłuchaj próbki</button>
          <button class="btn ghost" id="s-stop">■ Stop</button>
        </div>` : `<p class="notice">Ta przeglądarka nie obsługuje syntezy mowy. Lektor działa m.in. w Chrome, Edge i Safari.</p>`}
      </section>
      ${installSection()}
      ${bookSection()}
      <section class="card">
        <p class="eyebrow">O modlitwie</p>
        <p class="med">7 etapów × 5 części × 5 tajemnic = 175 dni. Etapy V–VII (Dzieje Kościoła) odpowiadają
          etapom I–III (Stary Testament): księgom historycznym, mądrościowym i prorockim. W centrum stoi etap IV —
          życie Jezusa i Maryi, a w nim tradycyjne tajemnice różańca (Radosne, Światła, Bolesne, Chwalebne) oraz Tajemnice Ciszy.
          Każda tajemnica ma 10 dopowiedzeń po słowie „Jezus” — po jednym do każdego „Zdrowaś Maryjo”,
          a każda część kończy się własną modlitwą.</p>
        ${stageOverview()}
        <p class="notice">Postęp zapisywany jest tylko na tym urządzeniu.</p>
        <button class="btn" id="s-reset">Wyczyść postęp i zacznij od nowa</button>
      </section>`;
    document.getElementById("s-start").onchange = (e) => {
      if (e.target.value) { state.start = e.target.value; save(); viewDay = null; renderSettings(); }
    };
    const startConfirm = document.getElementById("s-start-confirm");
    if (startConfirm) {
      startConfirm.onclick = () => {
        const val = document.getElementById("s-start").value || isoToday();
        state.start = val;
        save();
        viewDay = null;
        setView("today");
      };
    }
    app.querySelectorAll("[data-theme-set]").forEach((b) => {
      b.onclick = () => { setTheme(b.dataset.themeSet || null); renderSettings(); };
    });
    const vs = document.getElementById("s-voice");
    if (vs) {
      const fill = () => {
        const list = tts.voices();
        const cur = tts.current();
        vs.innerHTML = list.length
          ? list.map((v) => `<option value="${esc(v.name)}" ${cur && cur.name === v.name ? "selected" : ""}>${esc(v.name)}</option>`).join("")
          : `<option value="">Domyślny głos systemu</option>`;
        document.getElementById("s-voice-note").textContent = list.length
          ? "Najbardziej naturalnie brzmią głosy oznaczone „Natural”, „Online”, „Google” lub „Premium”."
          : "Nie znaleziono polskiego głosu. Doinstaluj go w ustawieniach systemu (Zamiana tekstu na mowę / Treść mówiona).";
      };
      fill();
      tts.onVoices = () => { if (document.getElementById("s-voice")) fill(); };
      vs.onchange = () => { state.voice = vs.value; save(); };
      const rate = document.getElementById("s-rate");
      rate.oninput = () => { document.getElementById("s-rate-val").textContent = Math.round(rate.value * 100) + "%"; };
      rate.onchange = () => { state.rate = Number(rate.value); save(); };
      document.getElementById("s-test").onclick = () => { stopSpeech(); tts.speak(PRAYERS.hailMary.text); };
      document.getElementById("s-stop").onclick = stopSpeech;
    }
    bindInstall();
    bindBook();
    bindVersionSeg("s", renderSettings);
    document.getElementById("s-open").onchange = (e) => { state.opening = e.target.checked; save(); };
    document.getElementById("s-close").onchange = (e) => { state.closing = e.target.checked; save(); };
    document.getElementById("s-reset").onclick = (e) => {
      const btn = e.currentTarget;
      btn.outerHTML = `<p class="notice">Usunąć cały postęp i datę rozpoczęcia?</p>
        <div class="row"><button class="btn" id="s-reset-yes">Tak, wyczyść</button>
        <button class="btn ghost" id="s-reset-no">Anuluj</button></div>`;
      document.getElementById("s-reset-yes").onclick = () => {
        state = { ...defaults, theme: state.theme, voice: state.voice, rate: state.rate };
        save(); viewDay = null; setView("today");
      };
      document.getElementById("s-reset-no").onclick = () => renderSettings();
    };
  }

  // ---------- Start ----------
  document.querySelectorAll(".tabbar button").forEach((b) => {
    b.onclick = () => { if (b.dataset.view === "today") viewDay = null; setView(b.dataset.view); };
  });
  document.addEventListener("visibilitychange", () => {
    // po powrocie do aplikacji następnego dnia odśwież bieżący dzień
    if (!document.hidden && view === "today" && !app.querySelector(".prayer-step")) render();
  });
  if ("serviceWorker" in navigator && location.protocol !== "file:" && window.self === window.top) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
  render();
})();

</script>

</body></html>
